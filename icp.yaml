canisters:
  - services/sovereign-cloud
  - name: frontend
    recipe:
      type: "@dfinity/static-site@v0.4.0"
      configuration:
        dir: dist
        build:
          - python3 scripts/assemble.py
        presync:
          - python3 scripts/mcp-discovery.py

networks:
  - name: local
    mode: managed
    gateway:
      port: 61304

environments:
  - name: ic
    network: ic
    canisters: [frontend, cloud]
    settings:
      frontend:
        environment_variables:
          PUBLIC_SOVEREIGN_CLOUD_GATEWAY: "https://icp-api.io"
          PUBLIC_SOVEREIGN_CLOUD_DERIVATION_ORIGIN: "https://vigkv-fqaaa-aaaac-bgeha-cai.icp.net"
