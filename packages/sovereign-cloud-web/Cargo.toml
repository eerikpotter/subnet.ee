[package]
name = "sovereign-cloud-web"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[dependencies]
sovereign-cloud = { path = "../sovereign-cloud", features = ["browser"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde_json = "1"
futures = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
