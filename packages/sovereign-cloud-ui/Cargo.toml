[package]
name = "sovereign-cloud-ui"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Shared Craft cloud dialogs, account session and save/open controller"

[workspace]

[dependencies]
sovereign-cloud = { path = "../sovereign-cloud", features = ["browser"] }
egui = "0.36"
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
candid = "0.10"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Location"] }

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot"] }
