[package]
name = "sovereign-cloud"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Internal, editor-independent Sovereign Cloud client and legacy-compatible contract"

[workspace]

[features]
browser = ["dep:ic-agent", "dep:ic-auth-client", "dep:wasm-bindgen", "dep:web-sys"]

[dependencies]
candid = "0.10"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
percent-encoding = "2"
url = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
ic-agent = { version = "0.45", default-features = false, features = ["wasm-bindgen"], optional = true }
ic-auth-client = { version = "=0.5.0-beta.0", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlDocument", "Location"], optional = true }

[dev-dependencies]
futures = "0.3"
