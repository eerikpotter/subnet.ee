[package]
name = "sovereign-cloud-text"
version = "0.1.0"
edition = "2024"
publish = false
[workspace]
exclude = ["vendor/lopdf"]
[dependencies]
lopdf = { path = "vendor/lopdf", version = "=0.45.0", default-features = false }
zip = { version = "=9.0.5", default-features = false, features = ["deflate"] }
roxmltree = "=0.21.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1.25"
